services:
  web:
    image: easyoffice-web:local
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env.docker
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:3000}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - media_data:/app/public/media
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    env_file:
      - path: .env.docker
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-easyoffice}
      POSTGRES_USER: ${POSTGRES_USER:-easyoffice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-easyoffice}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-easyoffice} -d ${POSTGRES_DB:-easyoffice}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
